name: Publish helm chart update

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  helm-chart-release:
    permissions:
      contents: write
    uses: ./.github/workflows/helm-chart-release.yaml
    with:
      release_ref: ${{ github.event.release.tag_name }}
    secrets:
      # NOTE: BOT_TOKEN is a PAT (repo scope) for the persesbot account.
      # Required to push a branch to perses/helm-charts and open the chart
      # update pull request.
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
