# Applied after config/default namePrefix/namespace transforms.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: perses-operator-controller-manager
  namespace: perses-operator-system
spec:
  template:
    spec:
      containers:
        - name: manager
          imagePullPolicy: IfNotPresent
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=127.0.0.1:8082"
            - "--leader-elect"
            - "--resource-sync-interval=15s"
