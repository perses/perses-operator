apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
  - script: |
      set -eu
      ORIGINAL_ARGS=$(kubectl get configmap tls-original-manager-args -n "$NAMESPACE" \
        -o jsonpath='{.data.args}')
      kubectl patch deployment perses-operator-controller-manager \
        -n perses-operator-system \
        --type=strategic \
        -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"manager\",\"args\":$ORIGINAL_ARGS}]}}}}"
      kubectl rollout status deployment perses-operator-controller-manager \
        -n perses-operator-system --timeout=120s
