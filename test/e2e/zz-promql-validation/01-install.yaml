apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: promql-valid-dashboard
spec:
  config:
    display:
      name: Valid PromQL Dashboard
    duration: 5m
    panels:
      cpuPanel:
        kind: Panel
        spec:
          display:
            name: CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    query: rate(container_cpu_usage_seconds_total[5m])
    layouts:
      - kind: Grid
        spec:
          display:
            title: Row 1
            collapse:
              open: true
          items:
            - x: 0
              "y": 0
              width: 24
              height: 6
              content:
                "$ref": "#/spec/panels/cpuPanel"
